# Pinned to the exact toolchain CI installs (.github/workflows/ci.yml) and to the
# `rust-version` MSRV in Cargo.toml. A bare `stable` here silently WINS over the
# version CI asks rustup to install, so the MSRV job would lint and build on
# whatever stable happens to be that week — the drift only ever surfaces as a
# surprise CI failure on an unrelated PR.
[toolchain]
channel = "1.85.0"
components = ["rustfmt", "clippy"]
